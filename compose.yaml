services:
  pg:
    image: postgis/postgis
    expose:
      - "5432"
    volumes:
      - ./databases/schemas/schemas.sql:/docker-entrypoint-initdb.d/init_db.sql
      - pgdata:/var/lib/postgresql/data
    env_file: ".env"
    networks:
      - linkedOut_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d linkedout_db"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis
    networks:
      - linkedOut_net
    expose:
      - "6379"
    env_file: ".env"

  linkedout:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./firebase_key.json:/app/firebase_key.json
    env_file: ".env"
    ports:
      - "3113:3113"
    networks:
      - linkedOut_net
    depends_on:
      pg:
        condition: service_healthy

volumes:
  pgdata: {}

networks:
  linkedOut_net:
    driver: bridge
