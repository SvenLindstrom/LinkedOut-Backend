services:
  pg:
    image: postgis/postgis
    networks:
      - linkedOut_net_test
    ports:
      - "5432:5432"
    volumes:
      - ./databases/schemas/schemas.sql:/docker-entrypoint-initdb.d/init_db.sql
    env_file: ".dev.env"
  redis:
    image: redis
    networks:
      - linkedOut_net_test
    ports:
      - "6379:6379"
    env_file: ".dev.env"
networks:
  linkedOut_net_test:
    driver: bridge
